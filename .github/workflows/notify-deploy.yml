  #         fi

  notify:
    name: Notify automation
    runs-on: ubuntu-latest
    if: github.repository == 'gorgojs/medusa-sng-starter'

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: gorgojs
          repositories: automation

      - name: Dispatch event to automation
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const isManual = context.eventName === 'workflow_dispatch'
            const inputs = context.payload.inputs || {}

            // Compute component from changed paths on push
            let component = inputs.component || 'all'
            if (!isManual) {
              const changed = (context.payload.commits || [])
                .flatMap(c => [...(c.added || []), ...(c.modified || []), ...(c.removed || [])])
              // Workspace-level files (lockfile, root package.json) affect both apps
              const touchesShared = changed.some(p =>
                p === 'pnpm-lock.yaml' ||
                p === 'package.json' ||
                p === 'pnpm-workspace.yaml'
              )
              const touchesBackend = touchesShared || changed.some(p => p.startsWith('apps/backend/'))
              const touchesStorefront = touchesShared || changed.some(p => p.startsWith('apps/storefront/'))
              if (touchesBackend && touchesStorefront) component = 'all'
              else if (touchesBackend) component = 'backend'
              else if (touchesStorefront) component = 'storefront'
              else component = 'all'
            }

            console.log(`Dispatching deploy: component=${component}`)

            await github.rest.repos.createDispatchEvent({
              owner: 'gorgojs',
              repo: 'automation',
              event_type: 'medusa-sng-starter-updated',
              client_payload: {
                commit: context.sha,
                ref: context.ref,
                repository: context.payload.repository.full_name,
                component,
                no_cache: inputs.no_cache === 'true' || inputs.no_cache === true,
                skip_migrations: inputs.skip_migrations === 'true' || inputs.skip_migrations === true,
                run_seed: inputs.run_seed === 'true' || inputs.run_seed === true,
                create_admin: inputs.create_admin === 'true' || inputs.create_admin === true,
                backend_mode: inputs.backend_mode || 'server-only',
                // Default: no Redis — Medusa uses in-memory cache/events/workflows.
                with_redis: inputs.with_redis === 'true' || inputs.with_redis === true,
                // GitHub caps client_payload at 10 top-level keys; head_commit
                // dropped — it was debug-only and not consumed by deploy-gorgo-demo.yml.
              },
            })

            console.log('Successfully notified automation')
