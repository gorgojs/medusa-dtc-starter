name: Notify Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy'
        type: choice
        options: [ all, backend, storefront ]
        default: all
      no_cache:
        description: 'Build without Docker layer cache'
        type: boolean
        default: false
      skip_migrations:
        description: 'Skip Medusa DB migrations'
        type: boolean
        default: false
      run_seed:
        description: 'Run seed script after migrations'
        type: boolean
        default: false
      create_admin:
        description: 'Create initial admin user'
        type: boolean
        default: false
      backend_mode:
        description: 'Backend topology'
        type: choice
        options: [ server-only, server+worker ]
        default: server-only
      with_redis:
        description: 'Use Redis (off → in-memory cache/events/workflows)'
        type: boolean
        default: false

jobs:
  # # Run the same checks as test.yml; deploy is gated on success.
